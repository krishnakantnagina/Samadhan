# Government-style theme: blue / white / grey only: cool light-grey page, white panels, light hairline borders (see src/dashboard/cm/theme.py).
# Applies to every dashboard app started from this folder, including the older officer dashboard (app.py).
[theme]
primaryColor = "#0b5cab"
backgroundColor = "#eef2f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b1f33"
font = "sans serif"
borderColor = "#dfe6ef"
showWidgetBorder = true
dataframeBorderColor = "#dfe6ef"
dataframeHeaderBackgroundColor = "#eef3fa"

# Service spec: sc_welfare (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: sc_welfare
department: Scheduled Caste Welfare Department
label: {hi: अनुसूचित जाति कल्याण, en: Scheduled Caste welfare}
recognise: [अनुसूचित जाति की छात्रवृत्ति / SC scholarship, छात्रावास की समस्या / hostel, जाति प्रमाण पत्र / caste certificate SC, SC welfare scheme
    ka paisa nahi mila]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह अनुसूचित जाति कल्याण से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने में मदद
      करूँगा।', en: 'Sorry, this does not look like a Scheduled Caste welfare matter. Please describe your problem again and I will help route
      it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: scholarship, hi: छात्रवृत्ति नहीं मिली, en: Scholarship not received}
  - {value: hostel, hi: छात्रावास की समस्या, en: Hostel problem}
  - {value: scheme_benefit, hi: योजना का लाभ नहीं मिला, en: Scheme benefit not received}
  - {value: atrocity_relief, hi: अत्याचार राहत राशि, en: Atrocity relief amount}
  - {value: other, hi: अन्य समस्या, en: Other issue}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: छात्रवृत्ति नहीं मिली, छात्रावास की समस्या)', en: 'What is the problem? (for example: Scholarship
      not received, Hostel problem)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

# Service spec: revenue (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: revenue
department: Revenue Department
label: {hi: राजस्व विभाग, en: 'Revenue (land records, certificates, patwari)'}
recognise: [नामांतरण / बंटवारा नहीं हो रहा / mutation partition, खसरा खतौनी में गलती / land record error, जमीन पर कब्जा / अतिक्रमण / encroachment,
  पटवारी रिश्वत मांगता है / patwari bribe, जाति या आय प्रमाणपत्र नहीं बना / certificate]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह राजस्व विभाग से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने में मदद करूँगा।',
    en: 'Sorry, this does not look like a Revenue (land records, certificates, patwari) matter. Please describe your problem again and I will
      help route it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: mutation, hi: नामांतरण / बंटवारा अटका, en: Mutation or partition stuck}
  - {value: record_error, hi: खसरा / खतौनी में गलती, en: Error in khasra or khatauni}
  - {value: encroachment, hi: कब्जा / अतिक्रमण / सीमांकन, en: Encroachment or demarcation}
  - {value: certificate, hi: जाति / आय / निवासी प्रमाणपत्र, en: 'Caste, income or domicile certificate'}
  - {value: official_conduct, hi: पटवारी / तहसीलदार रिश्वत या देरी, en: Patwari or Tehsildar bribe or delay}
  - {value: other, hi: अन्य, en: Other}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: नामांतरण, खसरा)', en: 'What is the problem? (for example: Mutation or partition stuck, Error in
      khasra or khatauni)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

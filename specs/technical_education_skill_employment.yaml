# Service spec: technical_education_skill_employment (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: technical_education_skill_employment
department: Technical Education Skill and Employment Department
label: {hi: 'तकनीकी शिक्षा, कौशल एवं रोजगार', en: 'Technical education, skill and employment'}
recognise: [आईटीआई की समस्या / ITI problem, रोजगार कार्यालय पंजीयन / employment exchange, स्किल ट्रेनिंग प्रमाणपत्र / skill certificate, पॉलिटेक्निक
    प्रवेश]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह तकनीकी शिक्षा, कौशल एवं रोजगार से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने
      में मदद करूँगा।', en: 'Sorry, this does not look like a Technical education, skill and employment matter. Please describe your problem again
      and I will help route it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: iti_polytechnic, hi: आईटीआई / पॉलिटेक्निक की समस्या, en: ITI or polytechnic problem}
  - {value: employment_registration, hi: रोजगार पंजीयन / बेरोजगारी भत्ता, en: Employment registration or allowance}
  - {value: skill_training, hi: कौशल प्रशिक्षण / प्रमाणपत्र, en: Skill training or certificate}
  - {value: other, hi: अन्य, en: Other}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: आईटीआई, रोजगार पंजीयन)', en: 'What is the problem? (for example: ITI or polytechnic problem, Employment
      registration or allowance)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: institution_name
  type: string
  required: false
  max_length: 120
  label: {hi: संस्था का नाम, en: Name of the institution}
  hint: as the citizen said it
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

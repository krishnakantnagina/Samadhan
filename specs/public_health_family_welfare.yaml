# Service spec: public_health_family_welfare (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: public_health_family_welfare
department: Public Health and Family Welfare Department
label: {hi: स्वास्थ्य एवं परिवार कल्याण, en: Public health and family welfare}
recognise: [अस्पताल में डॉक्टर नहीं मिलते / doctor absent hospital, दवा उपलब्ध नहीं / medicine not available, एम्बुलेंस नहीं आई / ambulance 108,
  आयुष्मान कार्ड / Ayushman card, टीकाकरण / vaccination]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह स्वास्थ्य एवं परिवार कल्याण से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने
      में मदद करूँगा।', en: 'Sorry, this does not look like a Public health and family welfare matter. Please describe your problem again and
      I will help route it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: doctor_absent, hi: डॉक्टर / स्टाफ अनुपस्थित, en: Doctor or staff absent}
  - {value: medicine, hi: दवा / जाँच उपलब्ध नहीं, en: Medicine or test not available}
  - {value: ambulance, hi: एम्बुलेंस नहीं आई, en: Ambulance did not come}
  - {value: ayushman_card, hi: आयुष्मान कार्ड / इलाज का खर्च, en: Ayushman card or treatment cost}
  - {value: vaccination_ant, hi: टीकाकरण / जननी सुरक्षा / ए.एन.एम., en: 'Vaccination, maternity scheme or ANM'}
  - {value: other, hi: अन्य, en: Other}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: डॉक्टर, दवा)', en: 'What is the problem? (for example: Doctor or staff absent, Medicine or test
      not available)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: institution_name
  type: string
  required: false
  max_length: 120
  label: {hi: अस्पताल / स्वास्थ्य केंद्र का नाम, en: Name of the hospital or health centre}
  hint: as the citizen said it
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

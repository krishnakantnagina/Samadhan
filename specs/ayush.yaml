# Service spec: ayush (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: ayush
department: AYUSH Department
label: {hi: आयुष विभाग, en: 'AYUSH (Ayurveda, Unani, Homoeopathy)'}
recognise: [आयुर्वेदिक अस्पताल / ayurvedic dispensary, होम्योपैथी दवा नहीं मिल रही / homeopathy, आयुष डॉक्टर नहीं हैं]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह आयुष विभाग से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने में मदद करूँगा।',
    en: 'Sorry, this does not look like a AYUSH (Ayurveda, Unani, Homoeopathy) matter. Please describe your problem again and I will help route
      it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: dispensary, hi: औषधालय बंद / डॉक्टर अनुपस्थित, en: Dispensary closed or doctor absent}
  - {value: medicine, hi: दवा उपलब्ध नहीं, en: Medicine not available}
  - {value: registration, hi: आयुष पंजीयन / लाइसेंस, en: AYUSH registration or licence}
  - {value: other, hi: अन्य, en: Other}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: औषधालय बंद, दवा उपलब्ध नहीं)', en: 'What is the problem? (for example: Dispensary closed or doctor
      absent, Medicine not available)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: institution_name
  type: string
  required: false
  max_length: 120
  label: {hi: औषधालय / अस्पताल का नाम, en: Name of the dispensary or hospital}
  hint: as the citizen said it
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

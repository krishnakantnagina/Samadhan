# Service spec: higher_education (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: higher_education
department: Higher Education Department
label: {hi: उच्च शिक्षा, en: 'Higher education, colleges, universities'}
recognise: [कॉलेज की समस्या / college problem, विश्वविद्यालय परिणाम / university result, प्रोफेसर नहीं आते / college admission scholarship]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह उच्च शिक्षा से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने में मदद करूँगा।',
    en: 'Sorry, this does not look like a Higher education, colleges, universities matter. Please describe your problem again and I will help
      route it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: admission, hi: प्रवेश की समस्या, en: Admission problem}
  - {value: result_exam, hi: परीक्षा / रिजल्ट की समस्या, en: Exam or result problem}
  - {value: scholarship, hi: छात्रवृत्ति / फीस, en: Scholarship or fee}
  - {value: college_facility, hi: कॉलेज में सुविधा नहीं, en: Facilities in the college}
  - {value: other, hi: अन्य, en: Other}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: प्रवेश की समस्या, परीक्षा)', en: 'What is the problem? (for example: Admission problem, Exam or
      result problem)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: institution_name
  type: string
  required: false
  max_length: 120
  label: {hi: कॉलेज / विश्वविद्यालय का नाम, en: Name of the college or university}
  hint: as the citizen said it
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

# Service spec: human_evaluation (S30/S31). NOT a department: the queue for complaints the AI could not place with confidence (and for departments
# that have no spec or offices yet). The citizen still gives a description and a location; a person in the CM office (Human Evaluation) assigns the
# department, using the suggestion and Jev's notes stored with the ticket. Always lands at the Human Evaluation desk with needs_review.

spec_version: 1
service: human_evaluation
department: Human Evaluation       # a queue, not a government department
label:
  hi: मानव समीक्षा
  en: Human evaluation

recognise:
  - a genuine complaint the AI could not place with confidence, or one for a department with no service spec or offices yet (health, education, police, ration, pension, ...)

out_of_scope:
  examples: [नमस्ते, मज़ाक, सामान्य ज्ञान]
  reply:
    hi: माफ़ कीजिए, मैं इस तरह के सवाल का जवाब नहीं दे सकता।
    en: Sorry, I am unable to answer this kind of question.

pilot:
  city: Bhopal
  wards: 5

routing:
  min_confidence: 0.7
  fallback_level: district
  fallback_status: needs_review
  max_match_distance_km: 5

confirmation: required

fields:
  - name: description
    type: string
    required: true
    max_length: 300
    label: {hi: शिकायत, en: Complaint}
    hint: the citizen's problem in one short sentence, in their own words (Hindi or Hinglish), never invented
    question:
      hi: "कृपया अपनी समस्या थोड़ा विस्तार से बताइए।"
      en: "Please describe your problem in a little more detail."

  - name: location
    type: location
    required: true
    label: {hi: स्थान, en: Location}
    ask_for: location
    accepts:
      gps: {lat: [-90, 90], lng: [-180, 180]}
      place_name: {min_length: 2, max_length: 100}
    question:
      hi: 'क्या आप अभी उसी जगह पर हैं जहाँ यह समस्या है? अगर हाँ, तो "हाँ, मैं यहीं हूँ" दबाइए। अगर नहीं, तो अपने गाँव या वार्ड का नाम बताइए।'
      en: 'Are you at the place where this problem is? If yes, tap "Yes, I am here". If not, tell me your village or ward name.'

  - name: duration_days
    type: integer
    required: false
    min: 0
    max: 365
    label: {hi: कितने दिनों से, en: Days affected}
    hint: "'3 दिन से' → 3, 'कल से' → 1, 'हफ्ते भर से' → 7"

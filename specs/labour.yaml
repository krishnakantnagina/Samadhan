# Service spec: labour (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: labour
department: Labour Department
label: {hi: श्रम विभाग, en: Labour}
recognise: [मजदूरी नहीं मिली / wages not paid, श्रमिक पंजीयन / labour registration, संबल योजना / sambal, बाल मजदूरी / child labour, फैक्ट्री में
    सुरक्षा नहीं]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह श्रम विभाग से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने में मदद करूँगा।',
    en: 'Sorry, this does not look like a Labour matter. Please describe your problem again and I will help route it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: wages, hi: मजदूरी / वेतन नहीं मिला, en: Wages not paid}
  - {value: registration, hi: श्रमिक पंजीयन / कार्ड, en: Labour registration or card}
  - {value: welfare_scheme, hi: श्रमिक कल्याण / संबल योजना का लाभ, en: Labour welfare or Sambal benefit}
  - {value: child_labour, hi: बाल मजदूरी / बंधुआ मजदूरी, en: Child or bonded labour}
  - {value: workplace_safety, hi: कार्यस्थल पर सुरक्षा / दुर्घटना, en: Workplace safety or accident}
  - {value: other, hi: अन्य, en: Other}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: मजदूरी, श्रमिक पंजीयन)', en: 'What is the problem? (for example: Wages not paid, Labour registration
      or card)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

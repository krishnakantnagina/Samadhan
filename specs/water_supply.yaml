# Service spec: water_supply (v1, draft by Lead, 27 Sep).
#
# Format: docs/specs/S03-service-spec-format.md.
# This file is the ONLY source of services, fields, questions and the department the Turn Engine
# may use. The LLM never invents any of them; the backend validates every value against it.
# Loaded once at startup (T11). Keys inside the API `summary` and `tickets.fields` (S01, S02) are
# the `name` of each field below.
#
# PROPOSED = my judgement, not from PROJECT.md. Dev: confirm or change (see docs/GAPS.md G-SPEC-1).

spec_version: 1
service: water_supply
department: Jal Vibhag              # returned as ticket.department (S01 4.4)
label:
  hi: पानी की समस्या
  en: Water supply

# Hints for the Turn Engine to pick this service. Not a rule engine.
recognise:
  - पानी नहीं आ रहा / paani nahi aa raha / no water
  - पानी का दबाव कम / low pressure
  - गंदा पानी / पानी में बदबू / dirty or smelly water
  - पाइपलाइन लीक / नल टूटा / pipe leakage, tap or tanker problem

# Anything else (other departments) gets a polite reply and no ticket. Never invent a service.
out_of_scope:
  examples: [बिजली, सड़क / गड्ढे, कचरा, राशन, "any non-water complaint"]
  reply:
    hi: माफ़ कीजिए, अभी मैं सिर्फ़ पानी से जुड़ी समस्याएँ दर्ज कर सकता हूँ। बिजली, सड़क जैसी दूसरी समस्याओं के लिए कृपया संबंधित विभाग से संपर्क करें। पानी की कोई समस्या हो तो मुझे बताइए।
    en: Sorry, I can only register water-related problems right now. For other issues such as electricity or roads, please contact the concerned department. If you have a water problem, tell me.

pilot:
  city: Bhopal
  wards: 5                          # office rows live in database/seed.sql (T05)

routing:
  min_confidence: 0.7               # below this → district office + needs_review (PROJECT.md)
  fallback_level: district
  fallback_status: needs_review
  max_match_distance_km: 5          # PROPOSED: GPS farther than this from every ward centroid
                                    # is "no ward match" (never assign the nearest ward blindly)

confirmation: required              # a ticket is created only after the citizen confirms

# Turn rules (backend enforced)
#  - Ask only for a missing REQUIRED field, one per turn, using its `question`.
#  - Optional fields are captured if the citizen volunteers them; never asked.
#  - All required fields present → action = confirm (summary lists every captured field).
#  - Target: a citizen who gives issue + location in one message reaches confirm with 0 questions.

fields:
  - name: issue_type
    type: enum
    required: true
    label: {hi: समस्या, en: Issue}
    values:                         # PROPOSED list
      - {value: no_supply,    hi: पानी नहीं आ रहा,   en: No water supply}
      - {value: low_pressure, hi: कम दबाव,          en: Low pressure}
      - {value: dirty_water,  hi: गंदा / बदबूदार पानी, en: Dirty or smelly water}
      - {value: leakage,      hi: पाइप / नल लीकेज,    en: Pipe or tap leakage}
      - {value: other,        hi: पानी की अन्य समस्या, en: Other water issue}
    question:
      hi: "आपको पानी की क्या समस्या है: पानी नहीं आ रहा, कम दबाव, गंदा पानी या लीकेज?"
      en: "What is the water problem: no water, low pressure, dirty water or a leak?"

  - name: location
    type: location
    required: true
    label: {hi: स्थान, en: Location}
    ask_for: location               # value of `ask_for` in the S01 response (shows the GPS button)
    accepts:
      gps: {lat: [-90, 90], lng: [-180, 180]}   # stored in tickets.lat / tickets.lng
      place_name: {min_length: 2, max_length: 100}  # ward, locality or village; stored in fields
    rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
    question:
      hi: 'क्या आप अभी उसी जगह पर हैं जहाँ पानी की समस्या है? अगर हाँ, तो "हाँ, मैं यहीं हूँ" दबाइए। अगर नहीं, तो अपने गाँव या वार्ड का नाम बताइए।'
      en: 'Are you at the place where the water problem is? If yes, tap "Yes, I am here". If not, tell me your village or ward name.'

  - name: duration_days
    type: integer
    required: false
    min: 0                          # 0 = started today
    max: 365
    label: {hi: कितने दिनों से, en: Days affected}
    hint: "'3 दिन से' → 3, 'कल से' → 1, 'हफ्ते भर से' → 7"

  - name: address_detail
    type: string
    required: false
    max_length: 200
    label: {hi: पता / लैंडमार्क, en: Address or landmark}
    hint: house, street or landmark exactly as the citizen said it

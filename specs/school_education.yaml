# Service spec: school_education (generated by backend/scripts/gen_department_specs.py; format docs/specs/S03-service-spec-format.md).
# DEMO routing data: the issue list is standard practice for this department, not read from a government list. The department string below is the
# same text as offices.department in database/migrations/004_all_department_offices.sql. Edit the generator, then re-run it; or edit this file by hand.
spec_version: 1
service: school_education
department: School Education Department
label: {hi: स्कूल शिक्षा / मध्याह्न भोजन, en: School education and mid-day meal}
recognise: [मिड डे मील नहीं मिल रहा / mid day meal nahi mil raha / PM POSHAN, स्कूल में शिक्षक नहीं आते / teacher absent / मास्टर साहब मारसाब
    नहीं आते, 'स्कूल की इमारत, शौचालय, किताबें, छात्रवृत्ति / school building, toilet, books, scholarship', school ki problem]
out_of_scope:
  examples: [any complaint about another department, chit-chat, general knowledge]
  reply: {hi: 'माफ़ कीजिए, यह स्कूल शिक्षा / मध्याह्न भोजन से जुड़ा मामला नहीं लगता। कृपया अपनी समस्या फिर से बताइए, मैं सही विभाग तक पहुँचाने
      में मदद करूँगा।', en: 'Sorry, this does not look like a School education and mid-day meal matter. Please describe your problem again and
      I will help route it to the right department.'}
pilot: {city: Madhya Pradesh, wards: 5}
routing: {min_confidence: 0.7, fallback_level: district, fallback_status: needs_review, max_match_distance_km: 5}
confirmation: required
fields:
- name: issue_type
  type: enum
  required: true
  label: {hi: समस्या, en: Issue}
  values:
  - {value: midday_meal, hi: मध्याह्न भोजन नहीं मिल रहा / खराब है, en: Mid-day meal not served or poor quality}
  - {value: teacher_absent, hi: शिक्षक अनुपस्थित / कमी, en: Teacher absent or shortage}
  - {value: infrastructure, hi: 'स्कूल भवन, शौचालय, पानी की समस्या', en: 'School building, toilet or water problem'}
  - {value: books_scholarship, hi: किताबें / छात्रवृत्ति / साइकिल नहीं मिली, en: 'Books, scholarship or cycle not received'}
  - {value: other, hi: स्कूल की अन्य समस्या, en: Other school issue}
  question: {hi: 'आपकी क्या समस्या है? (जैसे: मध्याह्न भोजन नहीं मिल रहा, शिक्षक अनुपस्थित)', en: 'What is the problem? (for example: Mid-day
      meal not served or poor quality, Teacher absent or shortage)'}
- name: location
  type: location
  required: true
  ask_for: location
  label: {hi: स्थान, en: Location}
  accepts:
    gps:
      lat: [-90, 90]
      lng: [-180, 180]
    place_name: {min_length: 2, max_length: 100}
  rule: gps or place_name is enough; the jurisdiction resolver maps it to an office (S02 offices)
  question: {hi: 'आपका गाँव या वार्ड कौन सा है? नाम बताइए, या "हाँ, मैं यहीं हूँ" दबाइए।', en: 'Which village or ward are you in? Tell me the
      name, or tap "Yes, I am here".'}
- name: duration_days
  type: integer
  required: false
  min: 0
  max: 365
  label: {hi: कितने दिनों से, en: Days affected}
  hint: '''3 दिन से'' -> 3, ''कल से'' -> 1, ''हफ्ते भर से'' -> 7'
- name: school_name
  type: string
  required: false
  max_length: 120
  label: {hi: स्कूल का नाम, en: Name of the school}
  hint: as the citizen said it
- name: address_detail
  type: string
  required: false
  max_length: 200
  label: {hi: पता / लैंडमार्क, en: Address or landmark}
  hint: house, street or landmark exactly as the citizen said it

# Service spec: general (S28 D-S28-4, 29 Sep). The catch-all triage service: a REAL complaint that fits none of the
# listed departments is registered here (description + location) instead of being declined. Always ends up in the
# district office with needs_review (there are no ward rows for this department, so routing always falls back).
# Used only when the Turn Engine finds no other service; the prompt says so explicitly.

spec_version: 1
service: general
department: General Triage          # DEMO name, see S28
label:
  hi: अन्य शिकायत
  en: Other complaint

recognise:
  - any genuine complaint that fits none of the other listed services (health, education, police, ration, pension, ...)

out_of_scope:
  examples: [नमस्ते, मज़ाक, सामान्य ज्ञान]
  reply:
    hi: माफ़ कीजिए, मैं इस तरह के सवाल का जवाब नहीं दे सकता।
    en: Sorry, I am unable to answer this kind of question.

pilot:
  city: Bhopal
  wards: 5

routing:
  min_confidence: 0.7
  fallback_level: district
  fallback_status: needs_review
  max_match_distance_km: 5

confirmation: required

fields:
  - name: description
    type: string
    required: true
    max_length: 300
    label: {hi: शिकायत, en: Complaint}
    hint: the citizen's problem in one short sentence, in their own words (Hindi or Hinglish), never invented
    question:
      hi: "कृपया अपनी समस्या थोड़ा विस्तार से बताइए।"
      en: "Please describe your problem in a little more detail."

  - name: location
    type: location
    required: true
    label: {hi: स्थान, en: Location}
    ask_for: location
    accepts:
      gps: {lat: [-90, 90], lng: [-180, 180]}
      place_name: {min_length: 2, max_length: 100}
    question:
      hi: 'क्या आप अभी उसी जगह पर हैं जहाँ यह समस्या है? अगर हाँ, तो "हाँ, मैं यहीं हूँ" दबाइए। अगर नहीं, तो अपने गाँव या वार्ड का नाम बताइए।'
      en: 'Are you at the place where this problem is? If yes, tap "Yes, I am here". If not, tell me your village or ward name.'

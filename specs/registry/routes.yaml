# L1..L4 route chain per department. DEMO / standard administrative practice, NOT read from a government list; confirm with a district CM Helpline
# branch before real use. Designations only (no officer names, no contacts). Generated by backend/scripts/gen_department_specs.py.
# Keys are registry department ids (specs/registry/departments.yaml). Escalation timing default: 7 days per level (sources disagree, see docs/DEPARTMENT_ROUTES.md).
